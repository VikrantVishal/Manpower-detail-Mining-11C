<script type="module">
import {
  db, collection, doc, getDoc, getDocs, query, where, orderBy,
  SHIFTS, OTHER_STATUS_OPTIONS, STATUS_COLORS, sortGroups, groupSortIndex,
  todayStr, formatDateLong, attendanceDocId, esc, isEmployeeActive,
  fetchDutyChartWorkbook, getDutyChartMapping, saveDutyChartMapping, autoDetectDateColumns,
  classifyShiftCode, DEFAULT_SHIFT_CODES, excelSerialToDateStr
} from "./firebase-config.js";
import { requireAuth, renderUserBadge } from "./auth.js";

const session = requireAuth();
if (session) {
  renderUserBadge('userBadge');
  initViewAttendancePage();
}

function initViewAttendancePage() {

function toast(msg,ms=3200){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toastHost').appendChild(t);setTimeout(()=>t.remove(),ms);}

document.getElementById('dDate').value = todayStr();
document.getElementById('mMonth').value = todayStr().slice(0,7);

// tabs switcher
document.getElementById('tabDaily').addEventListener('click', () => switchTab('daily'));
document.getElementById('tabMonthly').addEventListener('click', () => switchTab('monthly'));
function switchTab(which) {
  document.getElementById('dailyView').style.display = which==='daily' ? 'block' : 'none';
  document.getElementById('monthlyView').style.display = which==='monthly' ? 'block' : 'none';
  document.getElementById('tabDaily').className = which==='daily' ? 'btn-amber btn-sm' : 'btn-outline btn-sm';
  document.getElementById('tabMonthly').className = which==='monthly' ? 'btn-amber btn-sm' : 'btn-outline btn-sm';
  if (which==='monthly') loadGroupOptions();
}

function buildDailyPdfTitle(dateStr, shiftKey) {
  if (!dateStr || !SHIFTS[shiftKey]) return document.title;
  const [y, m, d] = dateStr.split('-');
  return `Attendance-${d}-${m}-${y.slice(-2)}-(${SHIFTS[shiftKey].label})`;
}

document.getElementById('dPrintBtn').addEventListener('click', () => {
  const originalTitle = document.title;
  document.title = buildDailyPdfTitle(document.getElementById('dDate').value, document.getElementById('dShift').value);
  let restored = false;
  const restoreTitle = () => {
    if (restored) return;
    restored = true;
    document.title = originalTitle;
    window.removeEventListener('focus', restoreTitle);
    document.removeEventListener('visibilitychange', onVisible);
  };
  const onVisible = () => { if (document.visibilityState === 'visible') restoreTitle(); };
  window.addEventListener('focus', restoreTitle);
  document.addEventListener('visibilitychange', onVisible);
  window.print();
  setTimeout(restoreTitle, 60000);
});
document.getElementById('mPrintBtn').addEventListener('click', () => window.print());

const ATT_LOG_START_DATE = '2026-07-14';
const LOG_SHIFT_ORDER = ['first', 'second', 'night'];

function showModal(title, bodyHtml, buttons) {
  const host = document.getElementById('modalHost');
  host.innerHTML = `<div class="overlay"><div class="modal" style="max-width:600px;">
    <h3>${esc(title)}</h3>
    <div class="modal-body" style="max-height:60vh; overflow-y:auto;">${bodyHtml}</div>
    <div class="btn-row" style="margin-top:16px; justify-content:flex-end;">${buttons}</div>
  </div></div>`;
  return host;
}
function closeModal() { document.getElementById('modalHost').innerHTML = ''; }

function shortDateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const dd = String(dt.getUTCDate()).padStart(2, '0');
  const mon = dt.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' });
  return `${dd}-${mon}-${String(y).slice(-2)}`;
}

function nextDateStr(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const next = new Date(Date.UTC(y, m - 1, d + 1));
  return `${next.getUTCFullYear()}-${String(next.getUTCMonth() + 1).padStart(2, '0')}-${String(next.getUTCDate()).padStart(2, '0')}`;
}

async function buildAttendanceLogHtml() {
  const from = ATT_LOG_START_DATE;
  const to = todayStr();
  if (from > to) return `<div class="empty-state">No records to show yet.</div>`;

  const q = query(collection(db, "attendance"), where("date", ">=", from), where("date", "<=", to), orderBy("date"));
  const snap = await getDocs(q);
  const subMap = {};
  snap.forEach(d => {
    const data = d.data();
    subMap[`${data.date}_${data.shift}`] = data.submittedBy || '';
  });

  const dates = [];
  for (let d = from; d <= to; d = nextDateStr(d)) dates.push(d);
  dates.reverse();

  let rows = '';
  dates.forEach(dateStr => {
    LOG_SHIFT_ORDER.forEach((shiftKey, idx) => {
      const submittedBy = subMap[`${dateStr}_${shiftKey}`];
      const isSubmitted = !!submittedBy;
      const statusHtml = isSubmitted
        ? `<span class="pill att-log-pill" style="background:var(--green);">Submitted</span>`
        : `<span class="pill att-log-pill" style="background:var(--red);">Not submitted</span>`;
      rows += `<tr>
        ${idx === 0 ? `<td rowspan="3" class="att-log-date" style="vertical-align:top; color:var(--text-hi); font-weight:700; font-family:'Share Tech Mono',monospace;">${esc(shortDateLabel(dateStr))}</td>` : ''}
        <td class="att-log-shift">${esc(SHIFTS[shiftKey].label)}</td>
        <td>${statusHtml}</td>
        <td class="att-log-by">${isSubmitted ? esc(submittedBy) : '<span style="color:var(--text-lo);">—</span>'}</td>
      </tr>`;
    });
  });

  return `<div class="table-scroll att-log-table">
    <table>
      <thead><tr><th>Date</th><th>Shift</th><th>Status</th><th>Submitted By</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

document.getElementById('attendanceLogBtn').addEventListener('click', async () => {
  const host = showModal('Attendance Log', `<div class="loader"><div class="spinner"></div> Loading submission log...</div>`, `<button class="btn-outline" id="closeAttLog">Close</button>`);
  host.querySelector('#closeAttLog').addEventListener('click', closeModal);
  try {
    const bodyHtml = await buildAttendanceLogHtml();
    const bodyEl = host.querySelector('.modal-body');
    if (bodyEl) bodyEl.innerHTML = bodyHtml;
  } catch (e) {
    const bodyEl = host.querySelector('.modal-body');
    if (bodyEl) bodyEl.innerHTML = `<div class="empty-state" style="color:var(--red);">Error loading log: ${esc(e.message)}</div>`;
    console.error(e);
  }
});

let dutyByEmpDate = null;
let dutyChartLoadFailed = false;
let dutyChartLoadFailReason = '';

async function ensureDutyChartLoaded() {
  if (dutyByEmpDate || dutyChartLoadFailed) return;
  try {
    let mapping = getDutyChartMapping();
    let workbook = await fetchDutyChartWorkbook();

    if (!mapping.sheetName || mapping.idCol === null || mapping.idCol === undefined) {
      const sheetName = workbook.SheetNames[0];
      const ws0 = workbook.Sheets[sheetName];
      const headerRows = XLSX.utils.sheet_to_json(ws0, { header: 1, raw: true, defval: "" });
      const headers0 = headerRows[0] || [];
      let guesses = { id: 0, name: 0, group: 0 };
      headers0.forEach((h, c) => {
        const low = String(h || "").toLowerCase();
        if (low.includes("emp") && low.includes("id")) guesses.id = c;
        if (low.includes("name")) guesses.name = c;
        if (low.includes("group") || low.includes("gang")) guesses.group = c;
      });
      mapping = { sheetName, headerRow: 1, idCol: guesses.id, nameCol: guesses.name, groupCol: guesses.group, shiftCodes: DEFAULT_SHIFT_CODES };
      saveDutyChartMapping(mapping);
    }

    const ws = workbook.Sheets[mapping.sheetName];
    const sheetRows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const headerRow = (mapping.headerRow || 1) - 1;
    const headers = sheetRows[headerRow] || [];
    const dateColMap = autoDetectDateColumns(headers, 0);

    dutyByEmpDate = {};
    for (let r = headerRow + 1; r < sheetRows.length; r++) {
      const row = sheetRows[r];
      if (!row || row.length === 0) continue;
      const name = String(row[mapping.nameCol] ?? "").trim();
      if (!name) continue;
      let id = String(row[mapping.idCol] ?? "").trim();
      if (!id) id = name.toUpperCase().replace(/\s+/g, "_");
      const byDate = {};
      Object.entries(dateColMap).forEach(([col, ds]) => {
        let cellRawValue = row[parseInt(col, 10)];
        if (typeof cellRawValue === "number" && cellRawValue > 30000 && cellRawValue < 80000) {
          cellRawValue = excelSerialToDateStr(cellRawValue);
        }
        byDate[ds] = classifyShiftCode(cellRawValue, mapping.shiftCodes || DEFAULT_SHIFT_CODES);
      });
      dutyByEmpDate[id] = byDate;
    }

    if (Object.keys(dateColMap).length === 0) {
      dutyChartLoadFailed = true;
      dutyChartLoadFailReason = 'Duty chart loaded, but no date columns were detected — check ⚙ Configure Duty Chart Mapping in Mark Attendance.';
      dutyByEmpDate = null;
    }
  } catch (e) {
    console.warn("Duty chart load failed:", e);
    dutyChartLoadFailed = true;
    dutyChartLoadFailReason = 'Could not load the Duty Chart (' + e.message + ') — Leave/Tour/Training records will not appear in the shift grid until this is resolved.';
  }
}

function getDutyShift(empId, dateStr) {
  if (!dutyByEmpDate) return null;
  const cleanId = String(empId ?? "").trim();
  const rec = dutyByEmpDate[cleanId];
  if (!rec) return null;
  const shiftKey = rec[dateStr];
  if (shiftKey === 'first' || shiftKey === 'second' || shiftKey === 'night' || shiftKey === 'rest') {
    return shiftKey;
  }
  return null;
}

// ================= PART A =================
let lastLoadedDate = '';
let lastLoadedShift = '';
let lastLoadedData = null;

document.getElementById('dLoadBtn').addEventListener('click', async () => {
  const dateStr = document.getElementById('dDate').value;
  const shiftKey = document.getElementById('dShift').value;
  const host = document.getElementById('dailyResult');
  host.innerHTML = `<div class="loader"><div class="spinner"></div> Loading...</div>`;
  lastLoadedDate = '';
  lastLoadedShift = '';
  lastLoadedData = null;
  try {
    const snap = await getDoc(doc(db, "attendance", attendanceDocId(dateStr, shiftKey)));
    if (!snap.exists()) {
      host.innerHTML = `<div class="card"><div class="empty-state">No attendance submitted yet for ${esc(formatDateLong(dateStr))} · ${esc(SHIFTS[shiftKey].label)}.</div></div>`;
      return;
    }
    const data = snap.data();
    lastLoadedDate = dateStr;
    lastLoadedShift = shiftKey;
    lastLoadedData = data;
    const groups = {};
    Object.entries(data.entries || {}).forEach(([id, e]) => { (groups[e.group||'Unassigned']=groups[e.group||'Unassigned']||[]).push({id,...e}); });
    const otByGroup = {};
    Object.entries(data.otEntries || {}).forEach(([id, e]) => { (otByGroup[e.group||'Unassigned']=otByGroup[e.group||'Unassigned']||[]).push({id,...e}); });
    const allGroupNames = sortGroups(Array.from(new Set([...Object.keys(groups), ...Object.keys(otByGroup)])));

    let html = `<div class="card">
      <div class="daily-sticky-hdr">
        <h2>${esc(formatDateLong(dateStr))} · ${esc(SHIFTS[shiftKey].label)}</h2>
        <p class="mono" style="color:var(--text-mid); font-size:0.8rem; margin-bottom:0;">
          Submitted by <strong style="color:var(--text-hi);">${esc(data.submittedBy||'—')}</strong>
          ${data.lastEditedBy && data.lastEditedBy!==data.submittedBy ? ` · Last edited by ${esc(data.lastEditedBy)}` : ''}
        </p>
      </div>`;
      
    allGroupNames.forEach(g => {
      const normalList = groups[g] || [];
      const otList = otByGroup[g] || [];
      html += `<div class="group-title">${esc(g)}</div>`;
      normalList.sort((a,b)=>a.name.localeCompare(b.name)).forEach(e => {
        const color = STATUS_COLORS[e.status] || '#9aa5b1';
        html += `<div class="emp-row"><div class="emp-name"><span class="id">${esc(e.id)}</span>${esc(e.name)}</div><span class="pill" style="background:${color};">${esc(e.status||'Not marked')}</span></div>`;
      });
      otList.sort((a,b)=>a.name.localeCompare(b.name)).forEach(e => {
        html += `<div class="emp-row"><div class="emp-name"><span class="id">${esc(e.id)}</span>${esc(e.name)} <span class="locked-tag">(OT)</span></div><span class="pill" style="background:${STATUS_COLORS.OT};">Present in OT</span></div>`;
      });
    });
    if (data.comments) html += `<div class="group-title">Comments</div><p style="color:var(--text-mid); font-size:0.85rem;">${esc(data.comments)}</p>`;
    html += `</div>`;
    host.innerHTML = html;
  } catch (e) {
    host.innerHTML = `<div class="card"><div class="empty-state" style="color:var(--red);">Error: ${esc(e.message)}</div></div>`;
  }
});

const OT_SLIP_SHIFT_LABEL = { first: '1st', second: '2nd', night: 'Night' };

function formatDMY(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d}-${m}-${y}`;
}

function buildOtSlipFilename(dateStr, shiftKey) {
  if (!dateStr || !SHIFTS[shiftKey]) return 'OT-Slip';
  const [y, m, d] = dateStr.split('-');
  return `OT-Slip-${d}-${m}-${y.slice(-2)}-(${SHIFTS[shiftKey].label})`;
}

function normalDutyLabel(shiftKey) {
  if (shiftKey === 'first' || shiftKey === 'second' || shiftKey === 'night') return SHIFTS[shiftKey].label;
  if (shiftKey === 'rest') return 'Rest Day';
  return '—';
}

async function buildOtSlipHtml(dateStr, shiftKey, otEntriesObj) {
  await ensureDutyChartLoaded();

  const otList = Object.entries(otEntriesObj || {}).map(([id, e]) => ({
    id: String(id ?? '').trim(),
    name: e.name || '',
    group: e.group || 'Unassigned'
  }));

  otList.sort((a, b) => {
    const ia = groupSortIndex(a.group), ib = groupSortIndex(b.group);
    if (ia !== ib) return ia - ib;
    if (a.group !== b.group) return String(a.group).localeCompare(String(b.group));
    return a.name.localeCompare(b.name);
  });

  let rows = '';
  otList.forEach((emp, idx) => {
    const dutyShiftKey = getDutyShift(emp.id, dateStr);
    const duty = normalDutyLabel(dutyShiftKey);
    rows += `<tr>
      <td class="otslip-center">${idx + 1}</td>
      <td>${esc(emp.name)}</td>
      <td class="otslip-center mono">${esc(emp.id)}</td>
      <td class="otslip-center">${esc(duty)}</td>
      <td class="otslip-center">${esc(emp.group)}</td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>`;
  });

  if (!rows) {
    rows = `<tr><td colspan="9" class="otslip-center" style="padding:14px;">No employees marked "Present in OT" for this date and shift.</td></tr>`;
  }

  const generatedOn = formatDMY(todayStr());
  const certDate = formatDMY(dateStr);
  const shiftPhrase = `${OT_SLIP_SHIFT_LABEL[shiftKey] || SHIFTS[shiftKey].label} shift`;

  return `
    <div class="otslip-header">
      <div class="otslip-header-left">
        <img class="otslip-logo" src="${NMDC_LOGO_DATA_URI}" alt="NMDC">
        <div class="otslip-office-lines">
          <div>OFFICE OF THE SHIFT IN-CHARGE</div>
          <div>11C MINING</div>
          <div>BAILADILA IRON ORE MINE</div>
          <div>KIRANDUL COMPLEX, KIRANDUL</div>
        </div>
      </div>
      <div class="otslip-header-right">
        <img class="otslip-logo" src="${GPTW_LOGO_DATA_URI}" alt="Great Place To Work Certified">
      </div>
    </div>
      <div class="otslip-date-line">DATED: ${esc(generatedOn)}</div>
    <div class="otslip-title">DETAILS OF OVERTIME / CR ENGAGEMENT</div>

    <p class="otslip-cert">This is hereby certified that the following persons were engaged in OT with prior permission from the Controlling Officer on <span style="font-weight: bold; text-decoration: underline;">${esc(certDate)}</span> during <span style="font-weight: bold; text-decoration: underline;">${esc(shiftPhrase)}</span>.</p>

    <table class="otslip-table">
      <thead>
        <tr>
          <th>S.N.</th>
          <th>Name</th>
          <th>SAP ID</th>
          <th>Normal Duty</th>
          <th>Equip. Opted.</th>
          <th>Punch Timing &ndash; In</th>
          <th>Punch Timing &ndash; Out</th>
          <th>OT Hours</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <p class="otslip-submission">Submitted for kind information &amp; necessary approval.</p>

    <div class="otslip-sign-row">
      <div class="otslip-sign-block">
        <div class="otslip-sign-line"></div>
        <div class="otslip-sign-label">Excavation In-Charge</div>
      </div>
      <div class="otslip-sign-block otslip-sign-right">
        <div class="otslip-sign-line"></div>
        <div class="otslip-sign-label">Shift In-Charge</div>
      </div>
    </div>
  `;
}

document.getElementById('genOtSlipBtn').addEventListener('click', async () => {
  if (!lastLoadedDate || !lastLoadedShift || !lastLoadedData) {
    toast('Load the daily attendance for a date and shift first.');
    return;
  }
  const btn = document.getElementById('genOtSlipBtn');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Generating...';
  try {
    const html = await buildOtSlipHtml(lastLoadedDate, lastLoadedShift, lastLoadedData.otEntries || {});
    document.getElementById('otSlipPrintArea').innerHTML = html;

    const originalTitle = document.title;
    document.title = buildOtSlipFilename(lastLoadedDate, lastLoadedShift);
    document.body.classList.add('ot-slip-mode');

    let restored = false;
    const restoreState = () => {
      if (restored) return;
      restored = true;
      document.title = originalTitle;
      document.body.classList.remove('ot-slip-mode');
      window.removeEventListener('focus', restoreState);
      document.removeEventListener('visibilitychange', onVisible);
    };
    const onVisible = () => { if (document.visibilityState === 'visible') restoreState(); };
    window.addEventListener('focus', restoreState);
    document.addEventListener('visibilitychange', onVisible);

    window.print();
    setTimeout(restoreState, 60000);
  } catch (e) {
    toast('Error generating OT slip: ' + e.message, 5000);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

document.getElementById('mMode').addEventListener('change', (e) => {
  const isRange = e.target.value === 'range';
  document.getElementById('mMonthField').style.display = isRange ? 'none' : 'block';
  document.getElementById('mRangeField').style.display = isRange ? 'grid' : 'none';
});

async function loadGroupOptions() {
  const sel = document.getElementById('mGroup');
  if (sel.dataset.loaded) return;
  try {
    const snap = await getDocs(collection(db, "employees"));
    const groups = new Set();
    snap.forEach(d => groups.add(d.data().group || 'Unassigned'));
    sortGroups(Array.from(groups)).forEach(g => sel.insertAdjacentHTML('beforeend', `<option value="${esc(g)}">${esc(g)}</option>`));
    sel.dataset.loaded = "1";
  } catch(e) { console.warn(e); }
}

const TOTAL_STATUSES = ["Present", "Present (Mutual)", "Absent", "Absent (Mutual)", "OT", "Present in OT", "Personal Leave","Medical Leave","Official Tour","PME","Meeting","Official Work","Training","Others","Public Holiday","General Shift","In other Shift","Comp-Off"];
const SHIFTS_ORDER = ['first','second','night'];
const SHIFT_ABBR = { first: '1st', second: '2nd', night: 'Nt' };
const STATUS_ABBR = {
  'Present':'P','Absent':'A','Present (Mutual)':'PM','Absent (Mutual)':'AM',
   'Present in OT':'POT',
  'Personal Leave':'PL','Medical Leave':'ML','Official Tour':'OFT','PME':'PME',
  'Meeting':'MT','Official Work':'OW','Training':'TR','Others':'OTR','Public Holiday':'PH','General Shift':'GS','In other Shift':'IOS','Comp-Off':'CO'
};

// Global variables for caching structural matrix states
let exportedDates = [];
let exportedEmpList = [];

document.getElementById('mLoadBtn').addEventListener('click', async () => {
  const mode = document.getElementById('mMode').value;
  let from, to;
  if (mode === 'month') {
    const m = document.getElementById('mMonth').value;
    if (!m) { toast('Select a month.'); return; }
    from = `${m}-01`;
    const [y, mo] = m.split('-').map(Number);
    const lastDay = new Date(y, mo, 0).getDate();
    to = `${m}-${String(lastDay).padStart(2,'0')}`;
  } else {
    from = document.getElementById('mFrom').value;
    to = document.getElementById('mTo').value;
    if (!from || !to) { toast('Select from and to dates.'); return; }
    if (from > to) {
      const msg = 'Invalid date range. "From Date" must be earlier than or equal to "To Date".';
      toast(msg, 5000);
      document.getElementById('monthlyResult').innerHTML =
        `<div class="card"><div class="empty-state" style="color:var(--red);">${esc(msg)}</div></div>`;
      document.getElementById('mExportBtn').style.display = 'none';
      return;
    }
  }
  const groupFilter = document.getElementById('mGroup').value;
  const host = document.getElementById('monthlyResult');
  host.innerHTML = `<div class="loader"><div class="spinner"></div> Loading records for ${esc(from)} → ${esc(to)}...</div>`;
  document.getElementById('mExportBtn').style.display = 'none';

  try {
    const q = query(collection(db, "attendance"), where("date", ">=", from), where("date", "<=", to), orderBy("date"));
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(d => docs.push(d.data()));

    const empSnap = await getDocs(collection(db, "employees"));
    const employees = {};
    empSnap.forEach(d => {
      const data = d.data();
      if ((data.group || '').trim().toUpperCase() === 'CASUAL LABOUR') return;
      if (groupFilter && (data.group||'Unassigned') !== groupFilter) return;
      // Active employees always show, even with no record yet for this
      // range. Inactive employees are only pre-populated if they're
      // currently Active — if they're Inactive, they're added further
      // below, but only when an actual attendance/leave record for them
      // exists in this date range.
      if (!isEmployeeActive(data)) return;

      const cleanEmpId = String(d.id ?? "").trim();
      employees[cleanEmpId] = { id: cleanEmpId, name: data.name, group: data.group || 'Unassigned', cells: {}, totals: {} };
    });

    const dateSet = new Set();
    
    let fillDate = from;
    while(fillDate <= to) {
      dateSet.add(fillDate);
      const [y, m, dd] = fillDate.split('-').map(Number);
      const next = new Date(Date.UTC(y, m - 1, dd + 1));
      fillDate = `${next.getUTCFullYear()}-${String(next.getUTCMonth() + 1).padStart(2, '0')}-${String(next.getUTCDate()).padStart(2, '0')}`;
    }

    docs.forEach(docData => {
      dateSet.add(docData.date);
      Object.entries(docData.entries || {}).forEach(([rawEmpId, e]) => {
        const empId = String(rawEmpId ?? "").trim();
        if (!employees[empId]) {
          const grp = e.group || 'Unassigned';
          if (groupFilter && grp !== groupFilter) return;
          employees[empId] = { id: empId, name: e.name, group: grp, cells: {}, totals: {} };
        }
        employees[empId].cells[`${docData.date}_${docData.shift}`] = e.status || '';
        const key = e.status || 'Unmarked';
        employees[empId].totals[key] = (employees[empId].totals[key]||0)+1;
      });
      
      // Integration of "Present in OT" (POT) into shift cell array grid mapping definitions
      Object.entries(docData.otEntries || {}).forEach(([rawEmpId, e]) => {
        const empId = String(rawEmpId ?? "").trim();
        if (!employees[empId]) {
          const grp = e.group || 'Unassigned';
          if (groupFilter && grp !== groupFilter) return;
          employees[empId] = { id: empId, name: e.name, group: grp, cells: {}, totals: {} };
        }
        
        const inferredShift = docData.shift || 'first';
        const cellKey = `${docData.date}_${inferredShift}`;
        
        // Present or leave rules override OT tracking in priority grid logic layout
        if (!employees[empId].cells[cellKey]) {
          employees[empId].cells[cellKey] = "Present in OT";
        }
        
        employees[empId].totals['OT'] = (employees[empId].totals['OT']||0)+1;
        employees[empId].totals['Present in OT'] = (employees[empId].totals['Present in OT']||0)+1;
      });
    });

    await ensureDutyChartLoaded();
    try {
      const leaveSnap = await getDocs(collection(db, "leaveRecords"));
      const leaveRecords = [];
      leaveSnap.forEach(d => leaveRecords.push(d.data()));

      leaveRecords.forEach(rec => {
        const recFrom = rec.fromDate || rec.singleDate;
        const recTo = rec.toDate || rec.singleDate;
        if (!recFrom || !recTo) return;
        if (!(recFrom <= to && recTo >= from)) return;
        if ((rec.group || '').trim().toUpperCase() === 'CASUAL LABOUR') return;
        if (groupFilter && (rec.group || 'Unassigned') !== groupFilter) return;

        const cleanRecEmpId = String(rec.employeeId ?? "").trim();
        if (!employees[cleanRecEmpId]) {
          // groupFilter was already checked above against rec.group, so
          // it's safe to add here unconditionally.
          employees[cleanRecEmpId] = { id: cleanRecEmpId, name: rec.employeeName, group: rec.group || 'Unassigned', cells: {}, totals: {} };
        }
        const emp = employees[cleanRecEmpId];

        const effFrom = recFrom > from ? recFrom : from;
        const effTo = recTo < to ? recTo : to;
        let dateStr = effFrom;
        while (dateStr <= effTo) {
          dateSet.add(dateStr); 
          const shiftKey = getDutyShift(rec.employeeId, dateStr);

          // Update total occurrences horizontally 
          emp.totals[rec.reason] = (emp.totals[rec.reason] || 0) + 1;

          // Target configuration mapping only against the explicit assigned shift
          if (shiftKey && shiftKey !== 'rest') {
            const cellKey = `${dateStr}_${shiftKey}`;
            if (!emp.cells[cellKey]) {
              emp.cells[cellKey] = rec.reason;
            }
          } else if (shiftKey === 'rest') {
            const restCellKey = `${dateStr}_rest`;
            emp.cells[restCellKey] = rec.reason;
          }
          
          const [y, m, dd] = dateStr.split('-').map(Number);
          const next = new Date(Date.UTC(y, m - 1, dd + 1));
          dateStr = `${next.getUTCFullYear()}-${String(next.getUTCMonth() + 1).padStart(2, '0')}-${String(next.getUTCDate()).padStart(2, '0')}`;
        }
      });
    } catch (e) {
      console.warn("leaveRecords overlay failed:", e);
    }

    const dates = Array.from(dateSet).sort();
    const empList = Object.values(employees).sort((a,b) => {
      const ia = groupSortIndex(a.group), ib = groupSortIndex(b.group);
      if (ia !== ib) return ia - ib;
      if (a.group !== b.group) return String(a.group).localeCompare(String(b.group));
      return a.name.localeCompare(b.name);
    });

    exportedDates = dates;
    exportedEmpList = empList;

    if (empList.length === 0) {
      host.innerHTML = `<div class="card"><div class="empty-state">No attendance records found for this range.</div></div>`;
      return;
    }

    // Build the structural table header string injecting right side 3px border style rules after each date block group
    let thead = `<tr><th>Employee</th><th>Group</th>`;
    dates.forEach(d => { 
      const [, mm, dd] = d.split('-');
      SHIFTS_ORDER.forEach((s, idx) => { 
        const isLastShift = idx === SHIFTS_ORDER.length - 1;
        const borderStyle = isLastShift ? ` style="border-right: 0.5px solid var(--amber) !important;"` : '';
        thead += `<th${borderStyle}>${dd}-${mm}<br>${SHIFT_ABBR[s]}</th>`; 
      }); 
    });
    TOTAL_STATUSES.forEach(s => thead += `<th>${esc(s)}</th>`);
    thead += `</tr>`;
    
    let tbody = '';
    empList.forEach(emp => {
      tbody += `<tr><td>${esc(emp.name)}<br><span class="mono" style="color:var(--text-lo); font-size:0.7rem;">${esc(emp.id)}</span></td><td>${esc(emp.group)}</td>`;
      dates.forEach(d => {
        SHIFTS_ORDER.forEach((s, idx) => {
          const st = emp.cells[`${d}_${s}`] || '';
          const isLastShift = idx === SHIFTS_ORDER.length - 1;
          
          let styleString = '';
          if (st) {
            const color = STATUS_COLORS[st] || '#9aa5b1';
            styleString = `color:#0a0e14; background:${color}; text-align:center; font-weight:700;`;
          } else {
            styleString = `color:var(--text-lo); background:transparent; text-align:center; font-weight:400;`;
          }
          
          if (isLastShift) {
            styleString += ` border-right: 0.5px solid var(--text-mid) !important;`;
          }

          const abbr = st ? (STATUS_ABBR[st] || st.slice(0,2)) : '·';
          tbody += `<td style="${styleString}">${esc(abbr)}</td>`;
        });
      });
      TOTAL_STATUSES.forEach(s => { tbody += `<td style="text-align:center;">${emp.totals[s]||0}</td>`; });
      tbody += `</tr>`;
    });

    const displayFrom = from.split('-').reverse().join('-');
    const displayTo = to.split('-').reverse().join('-');

    const dutyWarningHtml = dutyChartLoadFailed
      ? `<div class="empty-state" style="color:var(--amber); text-align:left; border:1px solid var(--amber-dim); border-radius:var(--radius); padding:10px 14px; margin-bottom:14px;">
           ⚠️ ${esc(dutyChartLoadFailReason || 'Duty chart could not be loaded — Leave/Tour/PME/Training records will not appear in the shift grid below (their totals are still counted correctly on the right).')}
         </div>`
      : '';

    host.innerHTML = `<div class="card">
      <h2>${esc(displayFrom)} → ${esc(displayTo)} ${groupFilter ? '· '+esc(groupFilter) : ''}</h2>
      ${dutyWarningHtml}
      <div class="table-scroll" style="max-height:70vh;">
        <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>
      </div>
      ${buildLegendHtml()}
    </div>`;
    
    // Display Excel export trigger button once records display successfully
    document.getElementById('mExportBtn').style.display = 'block';
  } catch (e) {
    host.innerHTML = `<div class="card"><div class="empty-state" style="color:var(--red);">Error: ${esc(e.message)}.</div></div>`;
    console.error(e);
  }
});

// Excel download execution block
document.getElementById('mExportBtn').addEventListener('click', () => {
  if (!exportedEmpList.length || !exportedDates.length) { toast('No data available to export.'); return; }
  
  const excelRows = exportedEmpList.map(emp => {
    const rowObj = {
      'Employee ID': emp.id,
      'Employee Name': emp.name,
      'Group': emp.group
    };
    
    exportedDates.forEach(d => {
      const [, mm, dd] = d.split('-');
      SHIFTS_ORDER.forEach(s => {
        const headerKey = `${dd}-${mm} (${SHIFT_ABBR[s]})`;
        const st = emp.cells[`${d}_${s}`] || '';
        rowObj[headerKey] = st ? (STATUS_ABBR[st] || st) : '·';
      });
    });
    
    TOTAL_STATUSES.forEach(s => {
      rowObj[s] = emp.totals[s] || 0;
    });
    
    return rowObj;
  });
  
  try {
    const ws = XLSX.utils.json_to_sheet(excelRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attendance Summary');
    XLSX.writeFile(wb, `Attendance_Summary_${todayStr()}.xlsx`);
    toast('Excel export downloaded successfully.');
  } catch (e) {
    toast('Export failed: ' + e.message, 5000);
  }
});

function buildLegendHtml() {
  const chip = (abbr, label, color) => `
    <span style="display:inline-flex; align-items:center; gap:7px; margin:0 16px 10px 0;">
      <span style="display:inline-flex; align-items:center; justify-content:center; min-width:30px; padding:3px 7px; border:1px solid ${color}; border-radius:6px; color:${color}; font-family:'Share Tech Mono',monospace; font-size:0.72rem; font-weight:700; background:${color}22;">${esc(abbr)}</span>
      <span style="color:var(--text-mid); font-size:0.8rem;">${esc(label)}</span>
    </span>`;

  const chips = Object.entries(STATUS_ABBR)
    .map(([status, abbr]) => chip(abbr, status, STATUS_COLORS[status] || '#9aa5b1'))
    .join('');

  return `<div style="display:flex; flex-wrap:wrap; align-items:center; padding-top:14px; margin-top:14px; border-top:1px solid var(--line);">
      ${chip('·', 'Not Marked', '#6d7c8e')}
      ${chips}
    </div>`;
}

}
</script>
